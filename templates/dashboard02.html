{% extends 'base.html' %}

{% block content %}

<div class="page-header">
    <h1>Dashboard 02</h1>
</div>

<div class="container-fluid my-5">

    <div class="content-card">



        <div class="dashboard-container">

            <div class="tableauPlaceholder" id="tableauViz2">

                <noscript>
                    <a href="#">
                        <img alt="Strategic Product Placement Analysis - Dashboard 2"
                            src="https://public.tableau.com/static/images/St/StrategicProductPlacementAnalysis-DASHBOARD02/StrategicProductPlacementAnalysis-DashBoard2/1_rss.png"
                            style="border:none;" />
                    </a>
                </noscript>

                <object class="tableauViz">
                    <param name="host_url" value="https%3A%2F%2Fpublic.tableau.com%2F" />
                    <param name="embed_code_version" value="3" />
                    <param name="site_root" value="" />
                    <param name="name"
                        value="StrategicProductPlacementAnalysis-DASHBOARD02/StrategicProductPlacementAnalysis-DashBoard2" />
                    <param name="tabs" value="no" />
                    <param name="toolbar" value="yes" />
                    <param name="animate_transition" value="yes" />
                    <param name="display_static_image" value="yes" />
                    <param name="display_spinner" value="yes" />
                    <param name="display_overlay" value="yes" />
                    <param name="display_count" value="yes" />
                    <param name="language" value="en-GB" />
                </object>

            </div>

        </div>

    </div>

</div>

<script type="text/javascript">
    var divElement = document.getElementById('tableauViz2');
    var vizElement = divElement.getElementsByTagName('object')[0];

    vizElement.style.width = '100%';
    vizElement.style.height = '900px';

    var scriptElement = document.createElement('script');
    scriptElement.src = 'https://public.tableau.com/javascripts/api/viz_v1.js';
    vizElement.parentNode.insertBefore(scriptElement, vizElement);
</script>

{% endblock %}
